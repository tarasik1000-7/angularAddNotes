<div class="container">

  <h1>My Notes</h1>

  <form (ngSubmit)="addNote()">

    <input
      type="text"
      name="title"
      [(ngModel)]="title"
      placeholder="Note title"
    >

    <textarea
      name="text"
      [(ngModel)]="text"
      placeholder="Write your note..."
    ></textarea>

    <button type="submit">
      Add
    </button>

  </form>

  <div class="notes">

    @for (note of notes; track $index) {

      <div class="note">

        <h2>{{ note.title }}</h2>

        <p>{{ note.text }}</p>

        <button
          class="delete-button"
          (click)="deleteNote($index)"
        >
          Delete
        </button>

      </div>

    }

  </div>

</div>
